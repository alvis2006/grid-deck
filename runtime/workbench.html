<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grid Deck · 動畫工作台</title><link rel="stylesheet" href="/runtime/deck.css"><link rel="stylesheet" href="/runtime/workbench.css"></head><body>
<header><div class="brand"><b>GRID DECK <span>／動畫工作台</span></b><small id="title">載入簡報…</small></div><span class="pill">試用版 01</span><span id="status" role="status">載入中</span><button id="undo">復原</button><button id="reload">重新讀取</button><a href="/" target="_blank">靜態編輯器 ↗</a><button id="save" class="primary">儲存動畫</button></header>
<main><aside class="left"><label for="slides">簡報頁面</label><select id="slides"></select><h3>畫面元素</h3><p class="hint">選一個元素，設定它如何出現。</p><div id="elements"></div></aside>
<section class="center"><div class="canvas-tools"><span id="group-label">進入頁面</span><button id="full">整頁播放 ↗</button></div><div id="canvas-wrap"><div id="canvas"></div></div><section class="timeline"><div class="timeline-head"><div><h2>動畫時間軸</h2><p>每個點擊步驟獨立計時，等待講者觸發。</p></div><button id="play">播放這一步</button><button id="reset">回到開頭</button></div><div id="groups" aria-label="點擊步驟"></div><div class="scrub"><span id="clock">0.00 s</span><input id="seek" type="range" min="0" max="1000" value="0" step="10" aria-label="預覽時間"><span id="end"></span></div><div id="tracks"></div><p class="hint">拖動色條調整延遲；也可以在右側輸入精確時間。</p></section></section>
<aside class="right"><p class="eyebrow">ANIMATION DETAILS</p><h2 id="selected">選取一個元素</h2><p class="hint" id="detail">先試著點選畫面中的標題。</p><div id="settings" hidden><label>出現效果<select id="effect"></select></label><label>觸發方式<select id="trigger"><option value="after">上一個結束後</option><option value="with">與上一個同時</option><option value="click">點擊開始新步驟</option></select></label><div class="fields"><label>延遲（秒）<input id="delay" type="number" min="0" max="60" step="0.05"></label><label>時長（秒）<input id="duration" type="number" min="0.05" max="60" step="0.05"></label></div><label>速度曲線<select id="easing"><option value="cubic-bezier(.2,.75,.25,1)">柔和減速</option><option value="linear">等速</option><option value="ease-in-out">慢起慢停</option><option value="ease-out">快速起步</option></select></label><div class="fields"><button id="earlier">順序提前</button><button id="later">順序延後</button></div><button id="remove" class="danger">移除這個動畫</button></div><button id="add" class="primary" hidden>加入淡入動畫</button><div class="note"><b>試用方式</b><ol><li>選取元素，換一種效果。</li><li>調整時間，播放這一步。</li><li>用「整頁播放」測試點擊節奏。</li><li>滿意後儲存，回編輯器匯出。</li></ol><p>此版精修入場動畫。退場、同一元素多段動畫與自訂路徑尚未開放。</p></div></aside></main><div id="message" role="status"></div>
<script src="/runtime/themes.js"></script><script src="/runtime/render.js"></script><script src="/runtime/player.js"></script><script src="/runtime/workbench.js"></script></body></html>
